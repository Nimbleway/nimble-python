          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      - APIKeyCookie: []
      summary: Create Agent Run
      tags:
      - Public API
  /v2/agents/{agent_id}/runs/{run_id}:
    get:
      description: 'Retrieve a run''s current state. Poll this endpoint after creating a run: the run is finished once `status`
        is `completed`, `failed`, or `cancelled`.'
      operationId: getAgentRun
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          format: uuid
          title: Agent Id
          type: string
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
