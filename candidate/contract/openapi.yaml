          anyOf:
          - type: string
          - type: 'null'
          description: API key id the usage authenticated with; `null` when it used no API key.
          examples:
          - 0123456789abcdef0123456789abcdef
          title: Api Key
        configuration:
          anyOf:
          - $ref: '#/components/schemas/UsageConfigurationNamePublicV2'
          - type: 'null'
