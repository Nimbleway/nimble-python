          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Agent Runs
      tags:
      - Public API
    post:
      description: 'Start an agent run. The run executes asynchronously: the response returns immediately with status `queued`,
        then poll `GET .../runs/{run_id}` until `completed` and fetch the output from `GET .../runs/{run_id}/result` — or
        set `enable_events: true` and follow `GET .../runs/{run_id}/events` for live progress.


        To enrich existing records instead of researching from scratch, pass them in `input_data`; this requires an `output_schema`
        (on the request or the agent).'
      operationId: createAgentRun
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          format: uuid
          title: Agent Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchAgentRunCreateRequestPublicV2'
        required: true
