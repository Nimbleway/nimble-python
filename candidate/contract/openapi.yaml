          - additionalProperties: false
            properties:
              referer:
                type: string
              required:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether this action is required. If true, pipeline stops on failure. Accepts boolean or string
