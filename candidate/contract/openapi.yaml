          title: Success Rate
        successes:
          description: Successful requests and runs.
          examples:
          - 118
          title: Successes
          type: integer
      required:
      - requests
      - runs
      - successes
      - errors
      - success_rate
      - bytes_in
      - bytes_out
      - cost_usd
      title: UsageMetricsPublicV2
      type: object
