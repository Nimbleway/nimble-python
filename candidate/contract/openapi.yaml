    ExtractBatchResponse:
      additionalProperties: false
      description: Response when a batch of extract tasks is created successfully.
      properties:
        batch_id:
          description: Unique identifier for the batch.
          type: string
        batch_size:
          description: Number of tasks in the batch.
          type: number
        tasks:
          description: List of created tasks.
          items:
            additionalProperties: false
            properties:
              _query: {}
              account_name:
                description: Account name that owns the task.
                type: string
              api_type:
                enum:
                - web
                - serp
                - ecommerce
                - social
                - media
                - agent
                - extract
                - fast-serp
                - labs
                type: string
              batch_id:
                anyOf:
                - type: string
                - type: 'null'
                description: Batch ID if this task is part of a batch.
                examples:
                - 4b0a90bf-c951-42e4-95b3-a95a65ba69fc
              created_at:
                description: Timestamp when the task was created.
                examples:
                - '2024-01-15T10:30:00Z'
                type: string
              download_url:
                anyOf:
                - format: uri
                  type: string
                - type: 'null'
                description: URL for downloading the task results.
                examples:
                - https://api.webit.live/api/v2/tasks/123e4567-e89b-12d3-a456-426614174000/results
              error:
                anyOf:
                - type: string
                - type: 'null'
                description: Error message if the task failed.
                examples:
                - Connection timeout
              error_type:
                anyOf:
                - type: string
                - type: 'null'
                description: Classification of the error type.
                examples:
                - timeout_error
              id:
                description: Unique task identifier.
                examples:
                - 123e4567-e89b-12d3-a456-426614174000
                minLength: 1
                type: string
              input:
                description: Original input data for the task.
              modified_at:
                description: Timestamp when the task was last modified.
                examples:
                - '2024-01-15T10:35:00Z'
                type: string
              output_url:
                anyOf:
                - type: string
                - type: 'null'
                description: Storage location of the output data.
              queue:
                description: Queue name the task was submitted to.
                type: string
              state:
                description: Current state of the task.
                enum:
                - pending
                - queued
                - in_progress
                - success
                - error
                examples:
                - pending
                type: string
              status_code:
                description: HTTP status code from the task execution.
                examples:
                - 200
                type: number
              status_url:
                description: URL for checking the task status.
                examples:
                - https://api.webit.live/api/v2/tasks/123e4567-e89b-12d3-a456-426614174000
                format: uri
                type: string
            required:
            - id
            - state
            - status_url
            - created_at
            - input
            - _query
            type: object
          type: array
      required:
      - batch_id
      - batch_size
      - tasks
      type: object
    ExtractPayload:
      properties:
        auto_driver_configuration:
          additionalProperties:
            maximum: 10
            minimum: 0
            type: integer
          description: 'Custom flow for the optimization engine: maps candidate names to the number of attempts to spend on
            each candidate before advancing (0 skips it). Key order defines the flow order. Providing it opts the request
            into ''auto'' driver selection.'
          examples:
          - vx10: 2
            vx10-pro: 0
            vx6-fast: 1
            vx6-stealth: 1
            vx8: 5
            vx8-pro: 5
          propertyNames:
            type: string
          type: object
