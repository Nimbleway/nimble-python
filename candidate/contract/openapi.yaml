          description: Platform-specific fields (e.g., price, rating, publish_date). Omitted from response when no extra data.
          title: Additional Data
        chunks:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Page content chunks most relevant to the query, most relevant first. Present only when cached-chunk
            enrichment is enabled for the account, and never for search_depth=deep; omitted otherwise. Only the leading results
            are enriched, and a result whose page could not be fetched in time keeps its snippet with no chunks, so this may
            be absent on some results of an otherwise enriched response.
          title: Chunks
        content:
          title: Content
          type: string
        description:
          title: Description
          type: string
        entities:
          anyOf:
          - items:
              $ref: '#/components/schemas/CompanyEntity'
            type: array
          - type: 'null'
          description: Structured data about what the result is about, such as the company with focus='company'. Omitted when
            there is none.
          title: Entities
        metadata:
          anyOf:
          - $ref: '#/components/schemas/SERPMetadata'
          - $ref: '#/components/schemas/WSAMetadata'
          title: Metadata
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
      required:
      - title
      - description
      - url
      - content
      - metadata
      title: ResultModel
      type: object
    RunStatsPublicV2:
      properties:
        extract_templates:
          description: Times the agent ran a Nimble extract template to parse a page into structured fields.
          title: Extract Templates
          type: integer
        extracts:
          description: Pages the agent fetched and extracted, including attempts that failed. Pages it already had in the
            run don't count.
          title: Extracts
          type: integer
        page_reads:
          description: Times the agent read or searched through pages it had already extracted.
          title: Page Reads
          type: integer
        scripts_run:
          description: Scripts the agent wrote and ran to process what it collected.
          title: Scripts Run
          type: integer
        searches:
          description: 'Web searches the agent ran: one per researched sub-question, plus any direct search calls.'
          title: Searches
          type: integer
      required:
      - searches
      - extracts
      - extract_templates
      - page_reads
      - scripts_run
      title: RunStatsPublicV2
      type: object
    SERPMetadata:
      description: Metadata for SERP-based search results (general, news, location).
      properties:
        country:
          title: Country
          type: string
        driver:
          anyOf:
          - type: string
          - type: 'null'
          title: Driver
        entity_type:
          title: Entity Type
          type: string
        locale:
          title: Locale
          type: string
        position:
          title: Position
          type: integer
      required:
      - position
      - entity_type
      - country
      - locale
      title: SERPMetadata
      type: object
    SafeSearch:
      description: 'Adult-content filtering a `/search` request asks for (SRCH-227).


        Declared from least to most filtering (see app/services/safe_search.py).

        Omitted on a request means each provider''s own default, not `off`.'
      enum:
      - 'off'
      - moderate
      - strict
      title: SafeSearch
      type: string
    ScreenshotAction:
      additionalProperties: false
      description: Capture a page screenshot
      properties:
        screenshot:
          oneOf:
          - type: boolean
          - additionalProperties: false
            properties:
              format:
                enum:
                - png
                - jpeg
                - webp
                type: string
              full_page:
                type: boolean
              quality:
                maximum: 100
                minimum: 0
                type: number
              required:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether this action is required. If true, pipeline stops on failure. Accepts boolean or string
                  "true"/"false". Default: true.'
              skip:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether to skip this action. Accepts boolean or string "true"/"false". Default: false.'
            type: object
      required:
      - screenshot
      type: object
    ScrollAction:
      additionalProperties: false
      description: Scroll the page or an element
      properties:
        scroll:
          oneOf:
          - type: number
          - type: string
          - additionalProperties: false
            properties:
              container:
                $ref: '#/components/schemas/Selector'
              required:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether this action is required. If true, pipeline stops on failure. Accepts boolean or string
                  "true"/"false". Default: true.'
              skip:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether to skip this action. Accepts boolean or string "true"/"false". Default: false.'
              to:
                $ref: '#/components/schemas/Selector'
              visible:
                type: boolean
              x:
                type: number
              y:
                type: number
            type: object
      required:
      - scroll
      type: object
    SearchDepth:
      description: 'Controls content richness and latency of search results.


        - lite: Token-efficient metadata for high-volume pipelines (title, URL, description only)

        - standard: Rich content (~2K chars) optimized for AI agents'
      enum:
      - lite
      - standard
      title: SearchDepth
      type: string
    SearchRequest:
      description: Request body model for the /search endpoint.
      properties:
        content_type:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by content type (only supported with focus=general). Supports semantic groups ('documents',
            'spreadsheets', 'presentations') and specific formats ('pdf', 'docx', 'xlsx', etc.)
          title: Content Type
        country:
          default: US
          description: Country code for geo-targeted results (e.g., 'US', 'GB', 'IL')
          title: Country
          type: string
        deep_search:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Deprecated. Use search_depth with full_content instead. true maps to 'lite' with full_content=true,
            false maps to 'lite'.
          title: Deep Search
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter results before this date (format: YYYY-MM-DD or YYYY)'
          title: End Date
        exclude_domains:
          anyOf:
          - items:
              type: string
            maxItems: 50
            type: array
          - type: 'null'
          description: List of domains to exclude from search results. Maximum 50 domains.
          title: Exclude Domains
        focus:
          anyOf:
          - $ref: '#/components/schemas/SdkStringVariant5b1cd5713a37'
          - items:
              $ref: '#/components/schemas/SdkStringVariant5b1cd5713a37'
            type: array
          default: general
          description: Search focus mode (e.g., 'general', 'news', 'shopping') or a list of explicit subagent names (e.g.,
            ['amazon_serp', 'target_serp'])
          title: Focus
        full_content:
          default: false
          description: Return full page content for each result, in addition to its title, url, and description. Works with
            either search_depth value. Higher recall and cost.
          title: Full Content
          type: boolean
        include_domains:
          anyOf:
          - items:
              type: string
            maxItems: 50
            type: array
          - type: 'null'
          description: List of domains to include in search results. Maximum 50 domains.
          title: Include Domains
        locale:
          default: en
          description: Language/locale code (e.g., 'en', 'fr', 'de')
          title: Locale
          type: string
        max_results:
          default: 10
          description: Maximum number of results to return. Actual count may be lower depending on availability.
          maximum: 100.0
          minimum: 1.0
          title: Max Results
          type: integer
        max_subagents:
          default: 3
          description: Maximum number of subagents to execute in parallel for WSA focus modes (shopping, social, geo). Ignored
            for SERP focus modes.
          maximum: 10.0
          minimum: 1.0
          title: Max Subagents
          type: integer
        output_format:
          $ref: '#/components/schemas/ParsingType'
          default: markdown
          description: 'Output format: plain_text, markdown, or simplified_html'
        query:
          description: Search query string
          minLength: 1
          title: Query
          type: string
        safe_search:
          anyOf:
          - $ref: '#/components/schemas/SafeSearch'
          - type: 'null'
          description: 'Adult-content filtering: ''off'', ''moderate'' or ''strict''. When omitted, each search provider applies
            its own default. Your account may enforce a minimum level, in which case the stricter of the two applies and is
            reported back in the response. Filtering is best effort, not guaranteed. With search_depth=''lite'', ''moderate''
            applies the same filtering as ''strict''. A level above ''off'' is rejected with focus ''serp'', ''shopping'',
            ''geo'' or ''social'', or with custom subagents. With search_depth=''lite'' it is also rejected with focus ''location'',
            time_range=''hour'', some countries, and queries over 400 characters or 50 words including the domain filters
            a focus adds (focus ''academic'' adds about 360 characters, so most academic queries are rejected).'
        search_depth:
          anyOf:
          - $ref: '#/components/schemas/SearchDepth'
          - type: 'null'
          description: 'Content richness: ''lite'' (titles, URLs, snippets) or ''standard'' (rich content, default).'
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter results after this date (format: YYYY-MM-DD or YYYY)'
          title: Start Date
        time_range:
          anyOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
          description: 'Filter by recency: hour, day, week, month, or year. Cannot be combined with start_date/end_date.'
      required:
      - query
      title: SearchRequest
      type: object
    SearchResponse:
      description: 'Response model from SearchService with results and optional LLM answer.


        Note: request_id is always a valid UUID generated internally by the middleware,

        so no validation is needed.'
      properties:
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
        answer_citations:
          anyOf:
          - items:
              $ref: '#/components/schemas/Citation'
            type: array
          - type: 'null'
          description: Citations mapping citation markers to result indices
          title: Answer Citations
        request_id:
          description: Unique identifier for this request (UUID)
          title: Request Id
          type: string
        results:
          items:
            $ref: '#/components/schemas/ResultModel'
          title: Results
          type: array
        safe_search:
          anyOf:
          - $ref: '#/components/schemas/SafeSearch'
          - type: 'null'
          description: 'The effective safe search level: the stricter of the requested level and any minimum your account
            enforces. Omitted when neither was set. With filtering on, empty results can mean every match was filtered out.'
        serp_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Cleaned SERP entities (e.g. KnowledgeGraph, TopStory, RelatedSearch). Only present for focus='serp'.
          title: Serp Data
        total_results:
          description: Number of results returned
          title: Total Results
          type: integer
      required:
      - total_results
      - results
      - request_id
      title: SearchResponse
      type: object
    Selector:
      description: CSS selector or array of alternative selectors. Use an array when you have multiple possible selectors
        for the same element.
      examples:
      - '#submit-button'
      - button.primary
      - - '#submit-button'
        - .submit-btn
        - button[type="submit"]
      oneOf:
      - minLength: 1
        type: string
      - items:
          minLength: 1
          type: string
        minItems: 1
        type: array
