          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Agent Run
      tags:
      - Public API
  /v2/agents/{agent_id}/runs/{run_id}/events:
    get:
      description: 'Stream a run''s progress as [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events)
        (`text/event-stream`). Create the run with `enable_events: true` to have events published. A keep-alive comment is
        sent every 15 seconds.'
      operationId: streamAgentRunEvents
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          format: uuid
          title: Agent Id
          type: string
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                discriminator:
                  mapping:
                    task_run.progress_msg.exec_status: '#/components/schemas/GatewayDef_4f3b7ab2bb4e1911_TaskRunProgressMsgEvent'
                    task_run.progress_msg.plan: '#/components/schemas/GatewayDef_4f3b7ab2bb4e1911_TaskRunProgressMsgEvent'
                    task_run.progress_msg.tool: '#/components/schemas/GatewayDef_4f3b7ab2bb4e1911_TaskRunProgressMsgEvent'
                    task_run.progress_stats: '#/components/schemas/GatewayDef_c0fe0f39c374a83b_TaskRunProgressStatsEvent'
                    task_run.state: '#/components/schemas/GatewayDef_fd08b460e1d38459_TaskRunStateEvent'
                  propertyName: type
                oneOf:
                - $ref: '#/components/schemas/GatewayDef_fd08b460e1d38459_TaskRunStateEvent'
                - $ref: '#/components/schemas/GatewayDef_4f3b7ab2bb4e1911_TaskRunProgressMsgEvent'
                - $ref: '#/components/schemas/GatewayDef_c0fe0f39c374a83b_TaskRunProgressStatsEvent'
          description: Server-sent event stream of run activity.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Stream Agent Run Events
      tags:
      - Public API
  /v2/agents/{agent_id}/runs/{run_id}/result:
    get:
      description: 'Fetch the output of a completed run. The `output` is `type: "text"` (a prose answer) or `type: "json"`
        (structured data matching the output schema), plus `trust` metadata with per-claim citations for the answer.


        While the run is still `queued` or `running` this endpoint returns `409`; if the run `failed` or was `cancelled` it
        returns `422` with the run and error details.'
      operationId: getAgentRunResult
      parameters:
      - in: path
