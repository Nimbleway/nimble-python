          examples:
          - US
          title: Country
        domain:
          anyOf:
          - type: string
          - type: 'null'
          description: Target domain; `null` when not recorded, and for the row combining every domain outside the top 100
            (see `meta.domains_capped`).
          examples:
          - example.com
          title: Domain
        product:
          anyOf:
          - $ref: '#/components/schemas/UsageNamePublicV2'
          - type: 'null'
          description: Product the usage belongs to; `null` when the usage is on a legacy name.
        service:
          anyOf:
          - $ref: '#/components/schemas/UsageNamePublicV2'
          - type: 'null'
          description: Service the usage belongs to.
      title: UsageDimensionsPublicV2
      type: object
    UsageMetaPublicV2:
      description: How the response was produced.
      properties:
        domains_capped:
          default: false
          description: Only the top 100 domains are broken out; the rest are combined in the row with domain null. Present,
            as true, only when such a row is in the result.
          examples:
          - true
          title: Domains Capped
          type: boolean
        end:
          description: 'End of the range answered (UTC): the requested end rounded up to a whole bucket.'
          examples:
          - '2026-11-03T00:00:00Z'
          format: date-time
          title: End
          type: string
        excluded_services:
          default: []
          description: Service keys left out because they cannot be split or filtered by the requested `api_key`, `domain`
            or `country`, or because their usage cannot be read yet; their usage is not in `data` or `totals`.
          examples:
          - - ip
          items:
            type: string
          title: Excluded Services
          type: array
        granularity:
          description: Time bucket size used.
          enum:
          - hour
          - day
          - month
          examples:
          - day
          title: Granularity
          type: string
        last_usage_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Most recent usage recorded for this account (UTC) in the services queried, at any time (not limited
            to the range); `null` when there is none.
          examples:
          - '2026-11-02T13:00:00Z'
          title: Last Usage At
        partial:
          description: 'True when figures may still change: figures for recent periods are still being loaded (the last hour
            or two for `hour`; today, and yesterday until 05:00 UTC, for `day`; the current month, and the previous one until
            the 4th, for `month`), or part of the usage could not be read this time.'
          examples:
          - true
          title: Partial
          type: boolean
        range_snapped:
          description: True when the requested range did not fall on bucket boundaries, so `start` and `end` were widened
            to whole buckets and the edge buckets are reported whole.
          examples:
          - false
          title: Range Snapped
          type: boolean
        start:
          description: 'Start of the range answered (UTC): the requested start rounded down to a whole bucket.'
          examples:
          - '2026-10-27T00:00:00Z'
          format: date-time
          title: Start
          type: string
        total:
          description: Number of rows before `limit` and `offset`; page while `offset + limit < total`.
          examples:
          - 7
          title: Total
          type: integer
        truncated:
          description: 'True when the range held more rows than one call can read: rows are cut, and `totals` may be incomplete
            too. Narrow the range, the filters or `group_by` to see all usage.'
          examples:
          - false
          title: Truncated
          type: boolean
      required:
      - start
      - end
      - granularity
      - range_snapped
      - partial
      - last_usage_at
      - truncated
      - total
      title: UsageMetaPublicV2
      type: object
    UsageMetricsPublicV2:
      description: Usage figures. A metric a service does not measure is `null`, not 0.
      properties:
        bytes_in:
          anyOf:
          - type: integer
          - type: 'null'
          description: Request bytes sent; `null` when the service does not measure it.
          examples:
          - 10240
          title: Bytes In
        bytes_out:
          anyOf:
          - type: integer
          - type: 'null'
          description: Response bytes received; `null` when the service does not measure it.
          examples:
          - 2048000
          title: Bytes Out
        cost_usd:
          anyOf:
