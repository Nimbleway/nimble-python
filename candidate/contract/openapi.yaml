info:
  description: Nimble API
  title: API Gateway
  version: 2.0.0
openapi: 3.1.0
paths:
  /v2/agents:
    get:
      description: List the active Web Search Agents in your account. Results are scoped to the workspace resolved from your
        token (or the optional `workspace_id` query parameter) and paginated with `offset`/`limit`.
      operationId: listAgents
      parameters:
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_WebSearchAgentResponsePublicV2_'
          description: Successful Response
        '422':
          content:
            application/json:
