components:
  schemas:
    AgentBatchBody:
      description: Request body for executing a batch of agent requests
      properties:
        inputs:
          items:
            additionalProperties: false
            properties:
              formats:
                description: Response formats to include. All disabled by default.
                examples:
                - - html
                  - markdown
                items:
                  enum:
                  - html
                  - markdown
                  - screenshot
                  - headers
                  - links
                  type: string
                minItems: 1
                type: array
              localization:
                type: boolean
              params:
                additionalProperties: {}
                properties: {}
                type: object
            type: object
          minItems: 1
          type: array
        shared_inputs:
          properties:
            agent:
              type: string
            formats:
              description: Response formats to include. All disabled by default.
              examples:
              - - html
                - markdown
              items:
                enum:
                - html
                - markdown
                - screenshot
                - headers
                - links
                type: string
              minItems: 1
              type: array
            localization:
              type: boolean
            params:
              additionalProperties: {}
              properties: {}
              type: object
          required:
          - agent
          type: object
      required:
      - inputs
      - shared_inputs
      type: object
    AgentBody:
      description: Request body for executing a WSA
      properties:
        agent:
          type: string
        formats:
          description: Response formats to include. All disabled by default.
          examples:
          - - html
            - markdown
          items:
            enum:
            - html
            - markdown
            - screenshot
            - headers
            - links
            type: string
          minItems: 1
          type: array
        localization:
          default: false
          type: boolean
        params:
          additionalProperties: {}
          properties: {}
          type: object
      required:
      - params
      - agent
      type: object
    AgentSourcesPublicV1:
      additionalProperties: false
      properties:
        allow:
          description: Source groups the agent is allowed to use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceCreateRequestPublicV1'
          title: Allow
          type: array
        avoid:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to avoid.
          title: Avoid
        block:
          description: Source groups the agent should not use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceCreateRequestPublicV1'
          title: Block
          type: array
        prioritize:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to prioritize.
          title: Prioritize
      title: AgentSourcesPublicV1
      type: object
    AgentSourcesPublicV2:
      additionalProperties: false
      properties:
        allow:
          description: Source groups the agent is allowed to use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceCreateRequestPublicV2'
          title: Allow
          type: array
        avoid:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to avoid.
          title: Avoid
        block:
          description: Source groups the agent should not use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceCreateRequestPublicV2'
          title: Block
          type: array
        prioritize:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to prioritize.
          title: Prioritize
      title: AgentSourcesPublicV2
      type: object
    AgentSourcesResponsePublicV1:
      additionalProperties: false
      properties:
        allow:
          description: Source groups the agent is allowed to use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceResponsePublicV1'
          title: Allow
          type: array
        avoid:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to avoid.
          title: Avoid
        block:
          description: Source groups the agent should not use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceResponsePublicV1'
          title: Block
          type: array
        prioritize:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to prioritize.
          title: Prioritize
      title: AgentSourcesResponsePublicV1
      type: object
    AgentSourcesResponsePublicV2:
      additionalProperties: false
      properties:
        allow:
          description: Source groups the agent is allowed to use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceResponsePublicV2'
          title: Allow
          type: array
        avoid:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to avoid.
          title: Avoid
        block:
          description: Source groups the agent should not use.
          items:
            $ref: '#/components/schemas/WebSearchAgentSourceResponsePublicV2'
          title: Block
          type: array
        prioritize:
          anyOf:
          - type: string
          - type: 'null'
          description: Free-text guidance describing sources or domains to prioritize.
          title: Prioritize
      title: AgentSourcesResponsePublicV2
      type: object
    AnswerAnnotationCitation:
      description: Annotation-style citation with character-range offsets into the answer text.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Snippet/description from the search result
          title: Description
        end_index:
          description: Exclusive end character offset of the inline link in the answer text
          title: End Index
          type: integer
        start_index:
          description: Inclusive start character offset of the inline link in the answer text
          title: Start Index
          type: integer
        title:
          title: Title
          type: string
        type:
          const: url_citation
          default: url_citation
          title: Type
          type: string
        url:
          title: Url
          type: string
      required:
      - start_index
      - end_index
      - url
      - title
      title: AnswerAnnotationCitation
      type: object
    AnswerMarkerCitation:
      description: Marker-style citation for the /answer endpoint ([N] references).
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Snippet/description from the search result
          title: Description
        index:
          description: 1-based citation index matching [N] markers in the answer text
          title: Index
          type: integer
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
      required:
      - index
      - url
      - title
      title: AnswerMarkerCitation
      type: object
    AnswerRequest:
      description: Request body model for the /answer endpoint.
      properties:
        citations:
          anyOf:
          - $ref: '#/components/schemas/CitationConfig'
          - type: 'null'
          description: Citation configuration. Omit for default behavior (citations enabled, no description).
        query:
          description: Question to answer using web search results
          maxLength: 1000
          minLength: 1
          title: Query
          type: string
      required:
      - query
      title: AnswerRequest
      type: object
    AnswerResponse:
      description: Response model for the /answer endpoint.
      properties:
        answer:
          description: LLM-generated answer to the query
          title: Answer
          type: string
        citations:
          anyOf:
          - items:
              $ref: '#/components/schemas/AnswerMarkerCitation'
            type: array
          - items:
              $ref: '#/components/schemas/AnswerAnnotationCitation'
            type: array
          description: 'Sources referenced in the answer. Shape depends on citations.format: ''marker'' includes index, ''annotation''
            includes start_index/end_index character ranges.'
          title: Citations
        request_id:
          description: Unique identifier for this request (UUID)
          title: Request Id
          type: string
      required:
      - answer
      - citations
      - request_id
      title: AnswerResponse
      type: object
    ArtifactDownloadUrlPublicV1:
      description: A pre-signed URL for downloading an artifact.
      properties:
        expires_at:
          description: When the download URL expires.
          format: date-time
          title: Expires At
          type: string
        url:
          description: Pre-signed URL to download the artifact.
          title: Url
          type: string
      required:
      - url
      - expires_at
      title: ArtifactDownloadUrlPublicV1
      type: object
    ArtifactDownloadUrlPublicV2:
      description: A pre-signed URL for downloading an artifact.
      properties:
        expires_at:
          description: When the download URL expires.
          format: date-time
          title: Expires At
          type: string
        url:
          description: Pre-signed URL to download the artifact.
          title: Url
          type: string
      required:
      - url
      - expires_at
      title: ArtifactDownloadUrlPublicV2
      type: object
    ArtifactListPublicV1:
      description: Artifacts produced by a run.
      properties:
        items:
          description: Artifacts produced by the run.
          items:
            $ref: '#/components/schemas/ArtifactPublicV1'
          title: Items
          type: array
      required:
      - items
      title: ArtifactListPublicV1
      type: object
    ArtifactListPublicV2:
      description: Artifacts produced by a run.
      properties:
        items:
          description: Artifacts produced by the run.
          items:
            $ref: '#/components/schemas/ArtifactPublicV2'
          title: Items
          type: array
      required:
      - items
      title: ArtifactListPublicV2
      type: object
    ArtifactPreviewPublicV1:
      description: A tabular preview of an artifact's contents.
      properties:
        columns:
          description: Column names in the preview.
          items:
            type: string
          title: Columns
          type: array
        row_count:
          description: Total number of rows in the artifact.
          title: Row Count
          type: integer
        rows:
          description: Sample rows from the artifact.
          items:
            additionalProperties: true
            type: object
          title: Rows
          type: array
      required:
      - columns
      - row_count
      - rows
      title: ArtifactPreviewPublicV1
      type: object
    ArtifactPreviewPublicV2:
      description: A tabular preview of an artifact's contents.
      properties:
        columns:
          description: Column names in the preview.
          items:
            type: string
          title: Columns
          type: array
        row_count:
          description: Total number of rows in the artifact.
          title: Row Count
          type: integer
        rows:
          description: Sample rows from the artifact.
          items:
            additionalProperties: true
            type: object
          title: Rows
          type: array
      required:
      - columns
      - row_count
      - rows
      title: ArtifactPreviewPublicV2
      type: object
    ArtifactPublicV1:
      description: A file produced by a run.
      properties:
        created_at:
          description: When the artifact was created.
          format: date-time
          title: Created At
          type: string
        description:
          description: Human-readable artifact description.
          title: Description
          type: string
        id:
          description: Artifact identifier.
          title: Id
          type: string
        type:
          description: Artifact type.
          title: Type
          type: string
      required:
      - id
      - type
      - description
      - created_at
      title: ArtifactPublicV1
      type: object
    ArtifactPublicV2:
      description: A file produced by a run.
      properties:
        created_at:
          description: When the artifact was created.
          format: date-time
          title: Created At
          type: string
        description:
          description: Human-readable artifact description.
          title: Description
          type: string
        id:
          description: Artifact identifier.
          title: Id
          type: string
        type:
          description: Artifact type.
          title: Type
          type: string
      required:
      - id
      - type
      - description
      - created_at
      title: ArtifactPublicV2
      type: object
    AutoScrollAction:
      additionalProperties: false
      description: Continuously scroll to load dynamic content
      properties:
        auto_scroll:
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/Duration'
          - additionalProperties: false
            properties:
              click_selector:
                $ref: '#/components/schemas/Selector'
              container:
                $ref: '#/components/schemas/Selector'
              delay_after_scroll:
                $ref: '#/components/schemas/Duration'
              idle_timeout:
                $ref: '#/components/schemas/Duration'
              loading_selector:
                $ref: '#/components/schemas/Selector'
              max_duration:
                $ref: '#/components/schemas/Duration'
              pause_on_selector:
                $ref: '#/components/schemas/Selector'
              required:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether this action is required. If true, pipeline stops on failure. Accepts boolean or string
                  "true"/"false". Default: true.'
              skip:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether to skip this action. Accepts boolean or string "true"/"false". Default: false.'
              step_size:
                type: number
            type: object
      required:
      - auto_scroll
      type: object
    BatchGetResponse:
      additionalProperties: false
      description: Response containing batch details with all tasks.
      properties:
        completed:
          description: Whether all tasks in the batch have finished.
          type: boolean
        completed_at:
          description: ISO timestamp when the batch completed.
          type: string
        completed_count:
          description: Number of tasks that have completed so far.
          type: number
        created_at:
          description: ISO timestamp when the batch was created.
          type: string
        id:
          description: Unique identifier for the batch.
          type: string
        progress:
          description: Completion ratio between 0 and 1.
          type: number
        status:
          const: success
          type: string
        tasks:
          description: List of tasks in the batch.
          items:
            anyOf:
            - additionalProperties: false
              properties:
                _query: {}
                account_name:
                  description: Account name that owns the task.
                  type: string
                api_type:
                  enum:
                  - web
                  - serp
                  - ecommerce
                  - social
                  - media
                  - agent
                  - extract
                  - fast-serp
                  - labs
                  type: string
                batch_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Batch ID if this task is part of a batch.
                  examples:
                  - 4b0a90bf-c951-42e4-95b3-a95a65ba69fc
                created_at:
                  description: Timestamp when the task was created.
                  examples:
                  - '2024-01-15T10:30:00Z'
                  type: string
                download_url:
                  anyOf:
                  - format: uri
                    type: string
                  - type: 'null'
                  description: URL for downloading the task results.
                  examples:
                  - https://api.webit.live/api/v2/tasks/123e4567-e89b-12d3-a456-426614174000/results
                error:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Error message if the task failed.
                  examples:
                  - Connection timeout
                error_type:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Classification of the error type.
                  examples:
                  - timeout_error
                id:
                  description: Unique task identifier.
                  examples:
                  - 123e4567-e89b-12d3-a456-426614174000
                  minLength: 1
                  type: string
                input:
                  description: Original input data for the task. ZDR tasks retain only a policy marker and required internal
                    routing metadata.
                modified_at:
                  description: Timestamp when the task was last modified.
                  examples:
                  - '2024-01-15T10:35:00Z'
                  type: string
                output_url:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Storage location of the output data.
                queue:
                  description: Queue name the task was submitted to.
                  type: string
                state:
                  description: Current state of the task.
                  enum:
                  - pending
                  - queued
                  - in_progress
                  - success
                  - error
                  examples:
                  - pending
                  type: string
                status_code:
                  description: HTTP status code from the task execution.
                  examples:
                  - 200
                  type: number
                status_url:
                  description: URL for checking the task status.
                  examples:
                  - https://api.webit.live/api/v2/tasks/123e4567-e89b-12d3-a456-426614174000
                  format: uri
                  type: string
              required:
              - id
              - state
              - status_url
              - created_at
              - input
              - _query
              type: object
            - type: 'null'
          type: array
      required:
      - status
      - id
      - completed
      - completed_count
      - progress
      - created_at
      - tasks
      type: object
    BatchProgressResponse:
      additionalProperties: false
      description: Lightweight batch progress without task details.
      properties:
        completed:
          description: Whether all tasks in the batch have finished.
          type: boolean
        completed_at:
          description: ISO timestamp when the batch completed.
          type: string
        completed_count:
          description: Number of tasks that have completed so far.
          type: number
        id:
          description: Unique identifier for the batch.
          type: string
        progress:
          description: Completion ratio between 0 and 1.
          type: number
        status:
          const: success
          type: string
      required:
      - status
      - id
      - completed
      - completed_count
      - progress
      type: object
    BrowserAction:
      description: A browser automation action. Exactly one action key must be present.
      oneOf:
      - $ref: '#/components/schemas/AutoScrollAction'
      - $ref: '#/components/schemas/ClickAction'
      - $ref: '#/components/schemas/EvalAction'
      - $ref: '#/components/schemas/FetchAction'
      - $ref: '#/components/schemas/FillAction'
      - $ref: '#/components/schemas/GetCookiesAction'
      - $ref: '#/components/schemas/GotoAction'
      - $ref: '#/components/schemas/PressAction'
      - $ref: '#/components/schemas/ScreenshotAction'
      - $ref: '#/components/schemas/ScrollAction'
      - $ref: '#/components/schemas/WaitAction'
      - $ref: '#/components/schemas/WaitForElementAction'
      - $ref: '#/components/schemas/WaitForNavigationAction'
    BrowserActions:
      description: Array of browser automation actions to execute sequentially
      example:
      - goto: https://example.com/login
      - wait_for_element: '#login-form'
      - fill:
          selector: '#username'
          value: user@example.com
      - fill:
          selector: '#password'
          value: password123
      - click: '#submit'
      - screenshot:
          full_page: true
      items:
        $ref: '#/components/schemas/BrowserAction'
      minItems: 1
      type: array
    Citation:
      description: Citation model that maps citation markers to result indices.
      properties:
        marker:
          description: Citation marker number (e.g., 1 for [1])
          minimum: 1.0
          title: Marker
          type: integer
        result_index:
          description: Zero-based index into the results array
          minimum: 0.0
          title: Result Index
          type: integer
      required:
      - marker
      - result_index
      title: Citation
      type: object
    CitationConfig:
      description: Configuration for citation behavior in the /answer endpoint.
      properties:
        enabled:
          default: true
          description: Include citations in the answer. When false, returns plain answer without [N] markers.
          title: Enabled
          type: boolean
        format:
          default: marker
          description: 'Citation format: ''marker'' embeds [N] in text; ''annotation'' returns text with inline markdown links
            and character-range citations.'
          enum:
          - marker
          - annotation
          title: Format
          type: string
        include_description:
          default: false
          description: Include description/snippet in each citation object. Default returns only index, url, title.
          title: Include Description
          type: boolean
      title: CitationConfig
      type: object
    ClickAction:
      additionalProperties: false
      description: Click on an element by selector
      properties:
        click:
          oneOf:
          - $ref: '#/components/schemas/Selector'
          - additionalProperties: false
            properties:
              count:
                default: 1
                minimum: 1
                type: number
              delay:
                $ref: '#/components/schemas/Duration'
              offset_x:
                maximum: 9007199254740991
                minimum: -9007199254740991
                type: integer
              offset_y:
                maximum: 9007199254740991
                minimum: -9007199254740991
                type: integer
              required:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether this action is required. If true, pipeline stops on failure. Accepts boolean or string
                  "true"/"false". Default: true.'
              scroll:
                default: true
                type: boolean
              selector:
                $ref: '#/components/schemas/Selector'
              skip:
                anyOf:
                - type: boolean
                - const: 'true'
                  type: string
                - const: 'false'
                  type: string
                description: 'Whether to skip this action. Accepts boolean or string "true"/"false". Default: false.'
              steps:
                minimum: 1
                type: number
              strategy:
                enum:
                - linear
                - ghost-cursor
                - windmouse
                type: string
              timeout:
                default: 15000
                description: 'Timeout in milliseconds. Set to 0 for infinite timeout (no timeout). Default: 15000ms.'
                minimum: 0
                type: number
              visible:
                default: true
                type: boolean
            required:
            - selector
            type: object
      required:
      - click
      type: object
    CompanyEntity:
      description: Structured data about the company a result is about.
      properties:
        financials:
          anyOf:
          - $ref: '#/components/schemas/CompanyFinancials'
          - type: 'null'
        founded_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Founded Year
        headquarters:
          anyOf:
          - $ref: '#/components/schemas/CompanyHeadquarters'
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        type:
          const: company
          default: company
          title: Type
          type: string
        web_traffic:
          anyOf:
          - $ref: '#/components/schemas/CompanyWebTraffic'
          - type: 'null'
        workforce_total:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          description: Employee count
          title: Workforce Total
      title: CompanyEntity
      type: object
    CompanyFinancials:
      properties:
        funding_latest_round:
          anyOf:
          - $ref: '#/components/schemas/FundingRound'
          - type: 'null'
        funding_total:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          description: USD
          title: Funding Total
        revenue_annual:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          description: USD
          title: Revenue Annual
      title: CompanyFinancials
      type: object
    CompanyHeadquarters:
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        postal_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Postal Code
      title: CompanyHeadquarters
      type: object
    CompanyWebTraffic:
      properties:
        avg_duration_seconds:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          title: Avg Duration Seconds
        country_rank:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          title: Country Rank
        history:
          anyOf:
          - items:
              $ref: '#/components/schemas/WebTrafficMonth'
            type: array
          - type: 'null'
          title: History
        visits_monthly:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          title: Visits Monthly
      title: CompanyWebTraffic
      type: object
    CrawlApiResponse:
      additionalProperties: false
      description: Crawl API response
      properties:
        account_name:
          type: string
        completed:
          type: number
        completed_at:
          anyOf:
          - anyOf:
            - type: string
            - additionalProperties: true
              type: object
          - type: 'null'
        crawl_id:
          format: uuid
          type: string
        crawl_options:
          additionalProperties: {}
          properties:
            allow_external_links:
              default: false
              type: boolean
            allow_subdomains:
              default: false
              type: boolean
            callback:
              anyOf:
              - additionalProperties: false
                properties:
                  events:
                    items:
                      enum:
                      - started
                      - page
                      - completed
                      - failed
                      type: string
                    type: array
                  headers:
                    additionalProperties:
                      type: string
                    propertyNames:
                      type: string
                    type: object
                  metadata:
                    additionalProperties: {}
                    propertyNames:
                      type: string
                    type: object
                  url:
                    format: uri
                    type: string
                required:
                - url
                type: object
              - format: uri
                type: string
            crawl_entire_domain:
              default: false
              type: boolean
            exclude_paths:
              items:
                type: string
              type: array
            ignore_query_parameters:
              default: false
              type: boolean
            include_paths:
              items:
                type: string
              type: array
            limit:
              default: 5000
              maximum: 10000
              minimum: 1
              type: integer
            max_discovery_depth:
              default: 5
              maximum: 20
              minimum: 1
              type: integer
            sitemap:
              default: include
              enum:
              - skip
              - include
