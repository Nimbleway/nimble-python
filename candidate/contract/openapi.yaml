          - type: 'null'
          description: Cost in US dollars, as a decimal string. Row costs are rounded to the cent per underlying bucket, so
            rows may not add up exactly to `totals.cost_usd`. `null` for accounts on fixed-price plans, whose spend isn't
            shown.
          examples:
          - '1.24'
          title: Cost Usd
        errors:
          description: Requests and runs that did not succeed.
          examples:
          - 2
          title: Errors
          type: integer
        requests:
          anyOf:
          - type: integer
          - type: 'null'
          description: Requests made; `null` for usage counted in runs only.
          examples:
          - 120
          title: Requests
        runs:
          anyOf:
          - type: integer
          - type: 'null'
          description: Web Search Agent runs; `null` for usage counted in requests only.
          examples:
          - null
          title: Runs
        success_rate:
          anyOf:
          - type: number
          - type: 'null'
          description: '`successes` divided by `requests` plus `runs`, 0 to 1; `null` when there were none.'
          examples:
